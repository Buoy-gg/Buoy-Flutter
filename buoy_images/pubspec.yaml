name: buoy_images
description: >-
  Buoy image debugger for Flutter — a live registry of every image the app loads
  with cache verdicts, load timings, oversize audits, and a failure log,
  streaming to Buoy Desktop.
version: 0.3.0
homepage: https://buoy.gg
repository: https://github.com/Buoy-gg/Buoy-Flutter

environment:
  sdk: ^3.9.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  buoy_core: ^0.3.0
  buoy_shared_ui: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
