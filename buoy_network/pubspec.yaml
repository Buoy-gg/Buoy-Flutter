name: buoy_network
description: >-
  Buoy network inspector for Flutter — captures all dart:io HTTP traffic via
  HttpOverrides (package:http, dio, images) with an in-app panel and live
  streaming to Buoy Desktop.
version: 0.3.2
homepage: https://buoy.gg
repository: https://github.com/Buoy-gg/Buoy-Flutter

environment:
  sdk: ^3.9.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  buoy_core: ^0.3.0
  buoy_shared_ui: ^0.3.0
  dio: ^5.10.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
